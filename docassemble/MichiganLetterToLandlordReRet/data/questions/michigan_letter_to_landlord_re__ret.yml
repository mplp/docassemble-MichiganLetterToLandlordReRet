---
id: letter to landlord review screen
event: review_full
question: |
  Review your answers
subquestion: |
  Click the **Edit** button in any section to make changes. Click the blue **Resume** button at the bottom if you are done.
review:

  - edit: flavor_choices
    button: |
      **Dessert flavors you like:** ${ flavor_choices.true_values() if flavor_choices.any_true() else word("none of these")}
  - Edit: users.revisit
    button: |
      **About you**

      % for item in users:
      ${ item }
      % endfor
  - Edit: forwarding_address.address
    button: |
      **Forwarding Address**

      ${ forwarding_address }
  - Edit: rental_address.address
    button: |
      **Rental Address**:

      ${ rental_address }
  - Edit: vacation_date
    button: |
      **Date you entered:**
      ${ vacation_date }
  - Edit: season_preferred
    button: |
      **Your preferred season:**
      ${ season_preferred }

      **Reason:**
      ${ season_explain }
  - Edit:
    - type_of_delivery
    - recompute:
      - recompute_delivery  
    button: |
      **Type of Delivery**:
      % if type_of_delivery == 'provided':
      Other
      
      ${ type_of_delivery_other }
      % elif type_of_delivery == 'texted':
      Text to 
      ${ phone_number_formatted(other_parties[0].phone_number) }
      % elif type_of_delivery == 'e-mailed':
      E-mail to 
      ${ other_parties[0].email }
      % else:
      ${ type_of_delivery }
      % endif
  - Edit: notification_address_same
    button: |
      **Notification Address** (where you sent your forwarding address):

      % if notification_address_same:
      ${ other_parties[0].address.block() }
      % else:
      ${ notification_address.block() }
      % endif
    show if: type_of_delivery == 'mailed'
  - Edit: deposit_amount
    button: |
      **Deposit Amount**:
      ${ currency(deposit_amount) }
  - Edit: 
    - any_deposit_returned
    - recompute: 
      - recompute_amount_returned
    button: |
      **Deposit Returned**:
      % if any_deposit_returned:
      Yes
      % else:
      None
      % endif
  - Edit: deposit_amount_returned
    button: |
      **Amount of Deposit Returned**:
      ${ currency(deposit_amount_returned) }
    show if: any_deposit_returned
  - Edit: other_parties.revisit
    button: |
      **Landlord Information**

      % for item in other_parties:
        * ${ item }

          ${ item.address.on_one_line() }
      % endfor
  - Edit:
      - exhibit_attachment.exhibits.has_exhibits
    button: |
      **Do you have documents you want the judge to see?**:

      % if exhibit_attachment.exhibits.has_exhibits:
      Yes
      % elif not exhibit_attachment.exhibits.has_exhibits:
      No
      % endif
  - Edit:
      - exhibit_attachment.exhibits.revisit
      - recompute:
        - exhibit_attachment.table_of_contents
    button: |
      **Uploaded Documents**

      % if exhibit_attachment.exhibits.number_gathered() > 0:
      ${ collapse_template(exhibit_attachment.exhibits.in_progress_exhibits) }
      % else:
      You have not uploaded any documents yet.
      % endif
    css class: bg-secondary-subtle
    show if: exhibit_attachment.exhibits.has_exhibits
validation code: |
  undefine('al_user_bundle._downloadable_files', 'al_user_bundle.generate_downloads_task')
