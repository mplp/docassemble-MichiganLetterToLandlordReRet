id: DownloadScreen
event: MLH_download
question: |
  Get your ${ MLH_form_type }
subquestion: |
  You can **view**, **download**, or **e-mail** your ${ MLH_form_type } to yourself below. Tap the "✎ Review / Edit" button to fix any mistakes.

  ${ optional_download_message }
    
  <h2 class="h3">Download or e-mail your ${ MLH_form_type }</h2>

  ${ action_button_html(url_action('review_full'), label='✎ Review / Edit', color='info') }
  
