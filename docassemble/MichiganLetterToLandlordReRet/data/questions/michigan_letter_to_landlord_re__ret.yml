question: |
  How did you tell your landlord your forwarding address?
#subquestion: |
#  Choose one of the three options.
fields:
  - Notice was: type_of_delivery
    input type: radio
    choices:
      - Hand-delivered: hand-delivered
      - Mailed: mailed
      - E-mailed: e-mailed
      - Texted: texted
